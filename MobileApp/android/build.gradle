buildscript {
    ext {
        // 36, not 35: Play now refuses a production release that targets below 36
        // (Android 16). Still built on AGP 8.7.2 (see kotlinVersion's own note below) —
        // that combination compiles fine against platform 36, just short of AGP's own
        // "officially tested" ceiling, which only ever affects a build-time warning, not
        // the build itself. Android 15 already enforced edge-to-edge for apps targeting
        // 35, carried forward unchanged at 36 — every screen already draws under the
        // status and navigation bars, and the app already wraps its screens in
        // SafeAreaView, which is what keeps that from clipping content.
        buildToolsVersion = "36.0.0"
        // 24, not 23: RN 0.77's own native libraries are built with minSdk 24 — AGP's
        // manifest merge rejects an app minSdk below a dependency's. Drops Android 6.0,
        // negligible share by 2026.
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        // 28, not the RN 0.77 template's 27.1: NDK r27 only 16KB-aligns .so files a
        // library's own build script explicitly opts into (via -Wl,-z,max-page-size=16384).
        // RN's own native libs (libhermes.so, libreactnative.so) do that themselves and came
        // out aligned under 27.3, but third-party CMake builds (react-native-screens,
        // react-native-pdf's bundled pdfium) don't — confirmed via llvm-readelf, their .so
        // files stayed 4 KB-aligned. NDK r28 makes 16 KB alignment the linker default for
        // every native build regardless of whether the library opted in, which is the only
        // way to cover those two without patching their native build scripts directly.
        ndkVersion = "28.2.13676358"
        // Matches the RN 0.77 template's own pin — kept in sync to avoid a Kotlin/AGP
        // version mismatch the react-native-gradle-plugin wasn't built against.
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        // Reads app/google-services.json at build time and generates the resource values
        // Firebase reads at runtime. Without it the SDK initialises with no project and
        // every getToken() call fails at runtime rather than at build time.
        classpath("com.google.gms:google-services:4.4.2")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
